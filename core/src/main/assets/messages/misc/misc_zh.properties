utils.difficulty.ultimate=终极
utils.difficulty.isekai=我转生成弱者后刚醒来就被老鼠打死，尝试了一万年才征服地牢，却发现这只是噩梦。出门喝水时又被卡车撞死，真正转生后才发现新世界更加残酷。组队违反国际地牢委员会规定，我被捕入狱，才知道监狱原来是更深的地牢。忍者的灵魂训练了我四十年，我终于成为最强的天狗，却被十只黑色史莱姆击败。我又深入地牢，用八十年学习工程学，造出了 DM-3000，却被自己的造物打败，跌入深坑。矮人将我救起，我为国王做了一百五十年奴隶，直到他被黑暗力量腐化。我再次深入恶魔大厅，借神赐之力找到魔王，却发现它只是巨眼，随后被巨拳砸死。下一刻我又在牢房醒来，才意识到自己能倒转时间，注定永远在这座诅咒地牢里受苦
utils.difficulty.bounty=被国际地牢委员会通缉
utils.difficulty.leonard=通缉纪录：伦纳德
utils.difficulty.sia=通缉纪录：希娅
