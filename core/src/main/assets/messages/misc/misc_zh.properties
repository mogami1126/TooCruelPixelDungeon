challenges.on_diet=缩餐节食
challenges.on_diet_desc=食物本就稀缺，还得省着吃！\n\n- 食物与丰饶之角的饱食效果降为原来的三分之一。\n- 其他来源的饱食效果不变。

challenges.famine=饥荒蔓延
challenges.famine_desc=怪物也饿坏了……\n\n- 普通干粮与馅饼被替换为小份干粮。\n- 移除神秘的肉、无味果与丰饶之角。

challenges.faith_armor=信念护体
challenges.faith_armor_desc=要相信自己，因为护甲已经不太可靠了！\n\n- 除布甲外，所有护甲的基础防御力降低。\n- 所有护甲通过升级获得的防御力大幅降低。\n- 灵壤守护者的防御力也大幅降低。

challenges.pharmacophobia=恐药异症
challenges.pharmacophobia_desc=你对治疗药水过敏！\n\n- 治疗药水及部分以其炼制的道具会额外使英雄中毒。\n- 在本版本中，治疗或护盾效果仍然生效。\n- 炼金催化剂不会随机产生治疗药水的效果。\n- 对其他角色的效果不变。

challenges.intoxication=毒性积聚
challenges.intoxication_desc=药水喝多了可不好。\n\n- 饮用药水会累积毒性。

challenges.plague=瘟疫横行
challenges.plague_desc=整座地牢都遭到了污染！\n\n- 受到伤害也会累积毒性。

challenges.barren_land=荒芜之地
challenges.barren_land_desc=这座地牢连干净的水都不剩了……\n\n- 移除露珠与植物。\n- 种子仍会出现，但不会生根发芽。

challenges.swarm_intelligence=集群智能
challenges.swarm_intelligence_desc=地牢里的怪物也在学习！\n\n- 一名敌人发现你时，附近的敌人也会被吸引到该位置。

challenges.insomnia=无眠之夜
challenges.insomnia_desc=这里没有安稳的睡眠。\n\n- 英雄无法入睡。\n- 敌人生成时保持清醒。\n- 敌人不在战斗时，行动速度翻倍。

challenges.heart_of_hive=蜂巢之心
challenges.heart_of_hive_desc=惊动蜂群后，你将无处藏身。\n\n- 一名敌人发现你时，所有敌人都会被吸引到该位置。\n- 敌人不会失去对你的追踪。

challenges.darkness=没入黑暗
challenges.darkness_desc=地牢毕竟是在地下！\n\n- 常规视野范围显著缩小。\n- 每层出现一根火把。\n- 照明效果的持续时间缩短。\n- 若已启用精英敌人，刺客精英的生成权重翻倍。

challenges.blindness=永恒长夜
challenges.blindness_desc=看不见时，只能依靠触觉辨认方向。\n\n- 需要贴近墙壁行走，才能维持方向感。\n- 走入开阔区域会陷入眩晕。

challenges.forbidden_runes=禁忌咒文
challenges.forbidden_runes_desc=最有用的符文，总是最难找到。\n\n- 移除地牢中一半的升级卷轴。

challenges.champion_enemies=精英强敌
challenges.champion_enemies_desc=会变强的不止你一个！\n\n- 普通敌人生成时有 1/8 的概率获得精英属性。\n- 精英敌人生成时会立即醒来。\n- 英雄能感知到精英敌人的出现。\n- 精英敌人免疫腐化。\n\n共有九种普通精英属性：
challenges.stronger_bosses=绝命头目
challenges.stronger_bosses_desc=头目变得更加难缠！\n\n_粘咕：_生命值增加 20%。\n- 水中每回合恢复三点生命。\n- 爆发攻击的蓄力由两回合缩短至一回合。\n_天狗：_生命值增加 25%。\n- 第一阶段的陷阱更致命，第二阶段使用技能更频繁。\n_DM-300：_生命值增加 33%。\n- 能量塔更强，需要摧毁三座。\n- 技能更强、更频繁；超载时速度更快。\n- 裸露导线的数量翻倍。\n_矮人国王：_生命值增加 50%。\n- 所有阶段的随从都更强。\n- 第一阶段更频繁使用技能与召唤。\n- 第二阶段每轮额外召唤两个随从。\n- 第三阶段生命值翻倍，召唤更频繁。\n_古神尤格：_\n- 每次同时召唤两个古神之拳。\n- 激光伤害增加 60%。\n- 召唤更强的随从。

challenges.elite_champions=高阶精英
challenges.elite_champions_desc=更危险的敌人带着护卫来了！\n\n- 精英敌人的生成概率提高至 1/5。\n- 精英敌人有 1/3 的概率成为高阶精英。\n- 若本层没有精英敌人，下一个生成的敌人必定成为精英。\n- 高阶精英进入追猎状态时会召唤护卫。\n\n本版本启用的高阶精英属性共有八种：

challenges.dungeon_of_champions=精英地牢
challenges.dungeon_of_champions_desc=现在轮到你充当经验和战利品了。\n\n- 敌人成为精英的概率进一步提高。\n- 敌人可同时拥有多种精英属性。\n- 高阶精英的基础护卫数量由一个增加至两个。\n- 高阶精英在游荡状态下经过 30 回合后，会重新获得护卫。

challenges.amnesia=健忘症
challenges.amnesia_desc=地牢里可没有疏散示意图。\n\n- 无法记住楼层布局与当前深度。

challenges.lobotomy=认知阻断
challenges.lobotomy_desc=这到底是什么东西？\n\n- 无法从外观区分不同的药水、卷轴与种子。

challenges.cursed=全物诅咒
challenges.cursed_desc=似乎有人碰了不该碰的东西。\n\n- 地牢中找到的物品都带有诅咒。

challenges.curse_magnet=诅咒缠绕
challenges.curse_magnet_desc=连背包也被诅咒了。\n\n- 无法放下或投掷带有诅咒的物品。

challenges.curse_enchant=永恒诅咒
challenges.curse_enchant_desc=摆脱束缚，不等于摆脱副作用。\n\n- 可以解除物品的诅咒束缚。\n- 诅咒附魔与诅咒刻印仍会保留。

challenges.blackjack=黑市帝国
challenges.blackjack_desc=再深的地牢，也有生意可做。\n\n- 物品需要在商店购买。\n- 原本的物品掉落改为金币。\n- 每层出现一间黑市。

challenges.horde=怪物群居
challenges.horde_desc=敌人大减价，买一送一！\n\n- 怪物生成数量翻倍。

challenges.invasion=生物入侵
challenges.invasion_desc=深处的敌人正在向上入侵！\n\n- 敌人的生成楼层向上提前两层。\n- 每个区域的第三层有概率生成下一区域的敌人。

challenges.legion=星界军团
challenges.legion_desc=这次你真的惹怒了它们。\n\n- 随时间不断生成大波敌人。\n- 每波开始后，楼层封锁 20 回合。\n- 封锁期间仍可跳入深渊。
challenges.horde_wave=一大波敌人正在逼近！
challenges.horde_lock=敌军来袭，楼层已封锁。还有 %s 回合解除封锁。

challenges.countdown=刻不容缓
challenges.countdown_desc=时间不会等你。\n\n- 下行时每层的基础探索时限为 300 回合，上行时为 150 回合。\n- “超额计划”“扩建工程”“地下世界”各使时限翻倍，“空间恐惧”使时限减半。\n- 超时后持续受到伤害。

challenges.racing_the_death=生死时速
challenges.racing_the_death_desc=那道影子始终紧随其后。\n\n- 黑暗能量轨迹会跟随你；在同一位置停留超过三次行动就会受到伤害。\n- 致命的分身始终落后你四步。

challenges.analgesia=自我迷失
challenges.analgesia_desc=你已无法感知自己的状态。\n\n- 隐藏英雄的各项状态数值。

challenges.big_levels=超额计划
challenges.big_levels_desc=地牢扩建工程开始了。\n\n- 普通房间数量翻倍。\n- 陷阱与敌人数量翻倍。

challenges.bigger_levels=扩建工程
challenges.bigger_levels_desc=建造者还在加班。\n\n- 再次翻倍“超额计划”的效果。

challenges.huge_levels=地下世界
challenges.huge_levels_desc=地牢仿佛比外面的世界还大。\n\n- 在前置挑战的基础上，再将普通房间、陷阱与敌人的数量乘以三。

challenges.small_levels=空间恐惧
challenges.small_levels_desc=越狭窄，越安心。\n\n- 普通房间与特殊房间的数量减半。\n- 战利品数量减半。\n- 陷阱与敌人的数量不变。

challenges.linear=直线路径
challenges.linear_desc=这座地牢的设计十分直白。\n\n- 楼层采用线性布局。\n- 多数进入“已探明但尚未到访”区域的捷径受到限制。\n- 作为补偿，楼层规模增加 50%。

challenges.mutagen=基因异变
challenges.mutagen_desc=敌人不一定是你熟悉的样子。\n\n- 稀有敌人变种的生成概率大幅提高。

challenges.evolution=全面进化
challenges.evolution_desc=变种已经成了常态。\n\n- 有稀有变种的敌人，生成时必定变为稀有变种。

challenges.resurrection=亡者归来
challenges.resurrection_desc=杀完一批，又来一批。\n\n- 敌人刷新不再需要等待。

challenges.rebirth=涅槃重生
challenges.rebirth_desc=有些敌人还有第二次机会。\n\n- 敌人死亡时，有较高概率复活一次，生命上限翻倍。

challenges.ascension=神力庇护
challenges.ascension_desc=古神正帮助敌人消灭你。\n\n- 敌人最多可以复活六次。\n- 每次复活都会获得永久增益。

challenges.extreme_caution=如履薄冰
challenges.extreme_caution_desc=你见过雷区吗？\n\n- 陷阱数量翻倍。

challenges.extreme_danger=刀山火海
challenges.extreme_danger_desc=这里曾是一座陷阱仓库，而且至今仍然运转良好。\n\n- 更容易生成致命陷阱。\n- 每层陷阱数量的下限提高。

challenges.extermination=楼层肃清
challenges.extermination_desc=别想直接溜走。\n\n- 楼层保持封锁，直到进入本层时已经存在的所有敌人被消灭。
challenges.extermination_lock=楼层已封锁。\n仍有 %s 个目标存活。
challenges.extermination_lock_last=楼层已封锁。\n只剩最后一个目标。

challenges.rook=横冲直撞
challenges.rook_desc=根据国际地牢委员会规定，禁止任何对角线行动。但远程敌人完全不受限制。\n\n-无法进行斜向移动与操作\n-敌人的远程攻击不受影响

challenges.no_perks=一无所长
challenges.no_perks_desc=这次只能靠基本功。\n\n- 禁用天赋系统。

challenges.manifesting_myriads=无尽大军
challenges.manifesting_myriads_desc=面对源源不断的敌军。\n\n- “星界军团”的封锁时间延长 50%。\n- “怪物群居”的数量倍率由二倍提高至三倍。\n- 波次间隔减半，但击杀能提供经验的敌人会推迟下一波。\n- 第一波不受击杀延迟影响。

challenges.arrowhead=碎颅之击
challenges.arrowhead_desc=越战越勇，也越战越脆。\n\n- 击杀敌人会增加一层箭镞。\n- 每层箭镞使造成的伤害增加 10%，受到的伤害增加 30%。\n- 未击杀敌人时，每经过 20 回合减少一层。

challenges.bloodbag=脆弱血肉
challenges.bloodbag_desc=一半是人，一半是血。\n\n- 受到伤害时，改为获得相当于该伤害一半的流血。

challenges.mirror_of_rage=愤怒之镜
challenges.mirror_of_rage_desc=与自己的怒火交战。\n\n- 敌人被击杀时，有 33% 的概率生成镜像怨灵。\n- 镜像怨灵只有一点生命，无法闪避；你会承受与其所受伤害相等的伤害。\n- 镜像怨灵会在十回合后消散。

challenges.ectoplasm=灵魂实体
challenges.ectoplasm_desc=灵魂变得可以触及了。\n\n- 镜像怨灵拥有实际的生命值，不再固定为一点。

challenges.spiritual_connection=巫毒亡魂
challenges.spiritual_connection_desc=怨灵之间的联系比你想象中更紧密。\n\n- 消灭镜像怨灵，会永久提高其他镜像怨灵的属性、存续时间与反伤。\n- 击杀普通敌人时的溢出伤害会加入新生镜像怨灵的生命值。\n- 生成镜像怨灵的概率提高至 50%。\n- 镜像怨灵生命值较高时，消散得更慢。

challenges.thoughtless=不假思索
challenges.thoughtless_desc=好东西绝不能留着不用。\n\n- 拾取以下道具时会被迫立即使用：\n鉴定卷轴、升级卷轴、附魔卷轴、魔法地图卷轴、充能卷轴、祛邪卷轴、嬗变卷轴、预知秘卷、魔能秘卷、先见秘卷、强化符石、附魔符石、感知符石。

challenges.exhibitionism=招摇过市
challenges.exhibitionism_desc=下一刻，眼前就可能多出一个敌人。\n\n- 敌人可以在你的视野内生成。\n- 敌人会尽量靠近你生成。

challenges.marathon=万米长跑
challenges.marathon_desc=动作快些，才能活下来。\n\n- 每次英雄行动的选择时间只有八秒；超时会自动推进回合。

challenges.on_a_beat=节奏大师
challenges.on_a_beat_desc=跟上节拍！\n\n- 每次英雄行动的选择时间缩短至两秒。\n- 点击背包按钮打开快捷使用菜单，长按才会打开背包。

rankings$record.something=在黑暗中被击杀

# Challenge localization
challenges.stacking_champions=精英群聚
challenges.stacking_champions_desc=整个怪物群都带着相同的威胁。\n\n- 同一叠怪物共享精英属性。\n- 其中的个体仍可拥有额外的精英属性。
challenges.big_rooms=宽敞房间
challenges.big_rooms_desc=希望你喜欢开阔地带。\n\n- 普通房间的尺寸翻倍。\n- 陷阱与敌人数量翻倍。\n- 与扩大楼层的挑战同时启用时，普通房间数量会适当减少。
challenges.bigger_rooms=巨型房间
challenges.bigger_rooms_desc=这里还算是地牢吗？\n\n- 再次翻倍“宽敞房间”的房间尺寸、陷阱与敌人数量。\n- 与扩大楼层的挑战同时启用时，会进一步减少普通房间数量。
challenges.indifferent_design=陷阱失认
challenges.indifferent_design_desc=该用第六感了。\n\n- 所有陷阱的外观都相同。
challenges.chaotic_construction=混乱施工
challenges.chaotic_construction_desc=至少第一层还不会出现即死陷阱。\n\n- 同一楼层的所有陷阱具有同一种随机效果。\n- 第 10 层起可出现天狗的飞镖陷阱效果。\n- 第 15 层起可出现解离与扭曲陷阱效果。\n- 第 20 层起可出现即死陷阱效果。
challenges.trap_testing_facility=陷阱试验场
challenges.trap_testing_facility_desc=欢迎参加新一轮陷阱测试！\n\n- 陷阱数量再乘以三。\n- 陷阱数量总是取生成范围的最大值。\n- 每次触发会连续发动二至五次。
challenges.stacking=叠怪危机
challenges.stacking_desc=一格里可能不止一个敌人。\n\n- 敌人以重叠的群体生成，发现目标后会散开。\n- 敌人数量增加 50%。
challenges.stacking_spawn=结伴刷新
challenges.stacking_spawn_desc=怪物也害怕孤独。\n\n- 刷新的怪物每叠至少有两个。
challenges.infinity_mobs=逼近无穷
challenges.infinity_mobs_desc=每块空地都藏着敌人。\n\n- 非特殊房间的每个空闲地块都生成一个怪物。\n- 与扩大楼层的挑战同时启用时，大量怪物会带来严重卡顿风险。
challenges.shared_pain=痛苦共担
challenges.shared_pain_desc=敌人的痛苦也会传到你身上。\n\n- 普通怪物所受伤害的一半会分摊给本层普通怪物与英雄；受击者也参与分摊，NPC 与头目不参与。\n- 头目被直接攻击时仍承受完整伤害，且免疫其他怪物产生的分摊伤害。\n- 攻击头目仍会将相当于其所受伤害一半的伤害分摊给普通怪物与英雄。
challenges.room_lock=正面对决
challenges.room_lock_desc=别离开竞技场！\n\n- 进入战斗时，周围会形成一座小型竞技场。\n- 离开竞技场会受到惩罚。\n- 战斗结束后解除封锁。
challenges.scorched_earth=焦土
challenges.scorched_earth_desc=让周围燃烧起来。\n\n- 离开水面过久会点燃周围，并蒸发附近的水。\n- 开局获得两个水爆晶核。
challenges.desert=荒漠
challenges.desert_desc=所经之处，寸草不生。\n\n- 荒漠沿你的足迹扩散，吞噬水与植物。\n- 草地与水的数量减半。\n- 每层保证生成一个水爆晶核。
challenges.retiered=阶位错乱
challenges.retiered_desc=这件武器似乎不太对劲。\n\n- 武器生成时有 50% 的概率降低一阶，25% 的概率提高一阶。\n- 提高后的阶位不超过五阶。
challenges.untiered=万物一阶
challenges.untiered_desc=武器不再有高低之分。\n\n- 所有武器都变为一阶。\n- 生成时获得相当于原阶位减一的额外升级等级。
challenges.barrier_breaker=破门而入
challenges.barrier_breaker_desc=任何门都不能挡路。\n\n- 走向门时，花费一回合将其摧毁。
challenges.limited_upgrades=升级封顶
challenges.limited_upgrades_desc=升级也有尽头。\n\n- 所有物品的升级等级上限为 +3。\n- 唯一例外是 Yendor 护符。
challenges.dance_floor=地牢舞池
challenges.dance_floor_desc=踩准颜色，跟上节拍。\n\n- 地面划分为每块 3×3 格的舞池区域。\n- 区域每隔数回合更换颜色，默认循环为绿→蓝→黄→紫。\n- 踏入区域后，接下来的一轮循环改为红→绿→蓝→黑→黄→紫。\n\n_红色：_造成直接伤害，对英雄的伤害特别高，并附带绿色区域的加速效果。\n_绿色：_行动速度翻倍。\n_蓝色：_使角色陷入眩晕。\n_黑色：_施加延迟伤害，对英雄的伤害特别高。\n_黄色：_在此被击杀的怪物提供双倍经验与更多战利品。\n_紫色：_受到的伤害翻倍。
challenges.humppa=哥布林波尔卡
challenges.humppa_desc=舞池各有各的节奏。\n\n- 各舞池区域的颜色变化不再同步。\n- 若启用“万米长跑”，每次行动的选择时间延长至十二秒。
challenges.the_last_waltz=最后的华尔兹
challenges.the_last_waltz_desc=这次只能凭感觉踩拍子。\n\n- 移除舞池区域的暂停提示标记。
challenges.crab_rave=螃蟹狂欢
challenges.crab_rave_desc=满地都是螃蟹！\n\n- 所有敌人的外观都变成螃蟹。
challenges.tumbler=不倒翁
challenges.tumbler_desc=一击毙命可没那么容易。\n\n- 怪物每条命可在致命伤害下存活一次。\n- 触发后以一点生命传送到随机位置，获得相当于生命上限三分之一的护盾，并进入睡眠。
challenges.saving_grace=救命恩典
challenges.saving_grace_desc=怪物也值得第二次机会。\n\n- “不倒翁”触发传送后，怪物会惊动其视野内的其他敌人。\n- 通过五十回合的睡眠恢复至满血。\n- 若启用“无眠之夜”，则立即恢复满血。
challenges.repeater=反复触发
challenges.repeater_desc=再来一次！\n\n- 陷阱触发后不会失效。
challenges.revenge=复仇之怒
challenges.revenge_desc=溢出的伤害会成为它们的怒火。\n\n- 对怪物造成的溢出伤害，会加入其视野内其他怪物的攻击伤害。
challenges.revenge_fury=复仇狂热
challenges.revenge_fury_desc=目睹同伴倒下，敌人变得更加狂暴。\n\n- 目睹其他敌人死亡后，十回合内造成的伤害翻倍，受到的伤害增加 20%。\n- 此效果可以叠加。
challenges.king_of_a_hill=山丘之王
challenges.king_of_a_hill_desc=怪物之间也会争夺霸权。\n\n- 怪物会互相攻击。\n- 非友方怪物击杀其他怪物后，会继承其全部精英属性，额外获得一种随机普通精英属性，并恢复满血。\n- 怪物数量增加 50%。
challenges.hail_to_the_king=王者万岁
challenges.hail_to_the_king_desc=向新的王者低头。\n\n- 怪物每完成第三次击杀，额外获得的随机普通精英属性改为高阶精英属性。
challenges.mimics=赝品地牢
challenges.mimics_desc=再也不用猜哪口箱子是宝箱怪了。\n\n- 所有普通宝箱都变为较弱的宝箱怪。
challenges.mimics_2=宝库陷阱
challenges.mimics_2_desc=宝藏多了，守卫也多了。\n\n- 自然生成的物品由较弱的宝箱怪持有。\n- 自然生成的武器由较弱的活化石像持有。
challenges.mimics_grind=宝箱派对
challenges.mimics_grind_desc=打宝箱，也是在刷宝。\n\n- 较弱的宝箱怪提升至金色宝箱怪的强度。\n- 它们会像普通宝箱怪一样掉落额外战利品。
challenges.agnosia=怪物失认
challenges.agnosia_desc=那只老鼠刚才是不是发射了什么？\n\n- 无法从外观区分不同种类的怪物。
challenges.archery_school=射术学堂
challenges.archery_school_desc=拐角也挡不住射击。\n\n- 英雄与敌人的远程交互都采用更精确的弹道。\n- 弹道可以穿过更多角度较窄的拐角，采用 YAPD 的弹道算法。
challenges.sniper_training=狙击训练
challenges.sniper_training_desc=仿佛能从墙边伸手攻击。\n\n- 若身旁上下左右任一格能够与目标进行远程交互，你也可以。\n- 这一规则同样适用于怪物。
challenges.biochip=生物芯片
challenges.biochip_desc=敌人的数据尽在眼前。\n\n- 可以查看怪物的详细属性信息。
challenges.chaos_wizard=混沌法师
challenges.chaos_wizard_desc=向随机之神祈祷吧！\n\n- 不生成武器，所有法杖都带有诅咒。\n- 法杖的诅咒无法解除。\n- 诅咒法杖的充能速度大幅提高。
challenges.grinding=战利品天堂
challenges.grinding_desc=这里确实是一座宝库。\n\n- 战利品数量随房间尺寸与房间数量的倍率增长。\n- 特殊房间数量随房间数量的倍率增长。
challenges.grinding_2=无尽刷宝
challenges.grinding_2_desc=一刻不停地刷下去！\n\n- 战利品数量再乘以五。\n- 有次数限制的掉落不再受限，背包除外。\n- 力量药水、升级卷轴等特殊物品也会进入常规生成。\n- 怪物掉落额外战利品，英雄等级不再封顶。\n- 开局拥有全部背包，并扩大物品容量。\n- 英雄达到三十级后，经验药水改为升级背包中的所有物品。\n- 可升级物品与卷轴可转化为升级卷轴。\n- 自动拾取周围 3×3 格内的物品。\n- 炼金能量无限。
challenges.grinding_3=韩式网游（MMO）
challenges.grinding_3_desc=刷怪、升级，再刷怪！此修改器仍处于开发中，后期数值与大量怪物仍可能造成不稳定。\n\n建议搭配扩大房间或楼层的挑战，以及“亡者归来”“无尽大军”或“逼近无穷”，提高刷怪效率。\n\n- 怪物当前生命超过上限的 50% 时，若伤害足以致命但不足当前生命的两倍，这次伤害会按楼层深度大幅削减。\n- 怪物生命、攻击伤害与经验随深度以 1.5 倍逐层增长；精准与闪避另按深度增长。英雄可通过无上限等级与装备升级持续成长。\n- 相比“无尽刷宝”，常规卷轴池中升级卷轴的生成权重由 10 提高至 30，力量药水的生成权重由 8 提高至 16。\n- 深层怪物掉落更多战利品。\n- 怪物生命超过上限的 50% 时，免疫变形与鼠化。
challenges.sliding=湿滑地面
challenges.sliding_desc=怪物怎么还能正常行走？\n\n- 英雄在水面上会滑行。\n- 滑过水面后，有 20% 的概率移除该格的水。\n- 水的生成量增加 50%。
utils.difficulty.easy=简单
utils.difficulty.normal=普通
utils.difficulty.hard=困难
utils.difficulty.very_hard=极难
utils.difficulty.insane=疯狂
utils.difficulty.suicide=自寻死路
utils.difficulty.impossible=不可能
utils.difficulty.hell=地狱
utils.difficulty.lunatic=狂乱
